<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier García Conde | Perfil Profesional</title>
    <!-- Fuente moderna Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(30, 41, 59, 0.55);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.18), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.18), transparent 40%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 18px;
        }

        .profile-card {
            width: 100%;
            max-width: 410px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrapper {
            position: relative;
            width: 122px;
            height: 122px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #1e293b;
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid var(--card-border);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn i.main-icon {
            font-size: 1.35rem;
            width: 24px;
            text-align: center;
        }

        .btn i.arrow {
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: transform 0.25s ease;
        }

        .btn:hover, .btn:active {
            transform: translateY(-3px);
            background: rgba(51, 65, 85, 0.75);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn:hover i.arrow {
            transform: translateX(3px);
            color: var(--text-main);
        }

        /* Detalles de color por plataforma */
        .btn-linkedin i.main-icon {
            color: #0a66c2;
        }
        .btn-linkedin:hover {
            border-color: rgba(10, 102, 194, 0.5);
            box-shadow: 0 8px 20px -6px rgba(10, 102, 194, 0.4);
        }

        .btn-credly i.main-icon {
            color: #ff6b00;
        }
        .btn-credly:hover {
            border-color: rgba(255, 107, 0, 0.5);
            box-shadow: 0 8px 20px -6px rgba(255, 107, 0, 0.35);
        }

        /* Botón principal de descarga de CV */
        .btn-cv {
            margin-top: 6px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: #ffffff;
            border: none;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.45);
        }

        .btn-cv i.main-icon, .btn-cv i.arrow {
            color: #ffffff;
        }

        .btn-cv:hover, .btn-cv:active {
            background: linear-gradient(135deg, #7dd3fc, #818cf8);
            box-shadow: 0 14px 28px -5px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <main class="profile-card">
        <div class="avatar-wrapper">
            <img src="FotoCV.jpeg" alt="Javier García Conde" class="avatar">
        </div>
        
        <h1>Javier García Conde</h1>
        <div class="role-badge">
            <i class="fa-solid fa-server"></i> Técnico Superior en Sistemas Informáticos y Redes
        </div>

        <div class="links">
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/javier-garc%C3%ADa-conde/" target="_blank" rel="noopener noreferrer" class="btn btn-linkedin">
                <span class="btn-content">
                    <i class="fa-brands fa-linkedin main-icon"></i>
                    <span>LinkedIn</span>
                </span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

            <!-- Credly -->
            <a href="https://www.credly.com/users/javier-garcia-conde" target="_blank" rel="noopener noreferrer" class="btn btn-credly">
                <span class="btn-content">
                    <i class="fa-solid fa-award main-icon"></i>
                    <span>Insignias en Credly</span>
                </span>
                <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
            </a>

            <!-- Descargar CV -->
            <a href="CVJavierGarciaConde.pdf" download="CV_Javier_Garcia_Conde.pdf" class="btn btn-cv">
                <span class="btn-content">
                    <i class="fa-solid fa-file-arrow-down main-icon"></i>
                    <span>Descargar CV (PDF)</span>
                </span>
                <i class="fa-solid fa-download arrow"></i>
            </a>
        </div>
    </main>

</body>
</html>
